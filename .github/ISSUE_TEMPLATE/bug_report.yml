# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests
name: Bug report
description: Report a bug in ObsPy
labels: ["bug-unconfirmed"]
body:
  - type: markdown
    attributes:
      value: For generic and usage questions, please use our [user forum](https://discourse.obspy.org/) instead. You will reach more people there and we hope to be able to get some burden off of our small core developer team. You can conveniently sign in with your GitHub account (other login options are available too). Please also make sure to search the forum for existing discussions that might match your question.
  - type: checkboxes
    id: did-check-existing-issues
    attributes:
      label: Avoid duplicates
      description: Please make sure that the bug wasn't already reported or even fixed by [searching in our existing issues](https://github.com/obspy/obspy/issues?q=)
      options:
        - label: I searched existing issues
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Describe the bug in your own words. If it used to work before, what version did it work on?
      placeholder: 
      value:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Code to Reproduce
      description: If possible, please provide a [minimum self-contained example](http://sscce.org/) Python snippet. Please make it so we can copy/paste your code and it will run (not depending on custom local files etc). The shorter and more down to the point, the easier it is for us to identify the problem and the faster it will get fixed =)
      placeholder: |
          Paste your Python code here

          from obspy.core.event import Event, Origin
          print(Event(origins=[Origin()]))
      render: python
  - type: textarea
    id: traceback
    attributes:
      label: Error Traceback / Program Output
      description: If applicable, please provide an error traceback or the output of above code
      placeholder: |
          Paste your error traceback / program output here

          Traceback (most recent call last):
            File "<stdin>", line 1, in <module>
            File "lib/python3.9/site-packages/obspy/core/event.py", line 2675, in __str__
              self.short_str(),
            File "lib/python3.9/site-packages/obspy/core/event.py", line 2661, in short_str
              origin.longitude)
          TypeError: a float is required
      render: Python traceback
  - type: input
    id: obspy-version
    attributes:
      label: ObsPy Version?
      description: |
        - On console: `python -c "import obspy; print(obspy.__version__)"`
        - In Python prompt: `import obspy; print(obspy.__version__)`
        - For a developer installation, just mention branch name (e.g. "current master")
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating System?
      description: Windows, OS/X, Arch, Debian, Ubuntu, etc.
  - type: input
    id: python-version
    attributes:
      label: Python Version?
      description: "On console: `python --version`"
  - type: dropdown
    id: install
    attributes:
      label: Installation Method?
      description: How did you install obspy? For other methods, please state installation method in bug summary above
      options:
        - conda
        - pip
        - developer installation / from source / git checkout
